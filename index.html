<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>educare イベントのご案内</title>
<meta name="description" content="educare（エデュカーレ）が開催する子ども向けイベントのご案内ページです。">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FBF5E9;--paper:#FFFDF7;--ink:#3B3128;--ink-soft:#6E5F50;--ink-faint:#9A8B7B;--line:#E3D5BC;--terracotta:#C25F3C;--blue:#2F76A8;}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;line-height:1.9;word-break:auto-phrase;line-break:strict;}
.wrap{max-width:760px;margin:0 auto;padding:56px 20px 72px;}
h1{font-family:"Kaisei Decol",serif;font-size:clamp(24px,5.5vw,32px);margin:0 0 8px;}
.lead{color:var(--ink-soft);font-size:15px;margin:0 0 32px;}
.cards{display:grid;gap:16px;}
a.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--terracotta);border-radius:18px;padding:24px 26px;}
a.card.ski{border-left-color:var(--blue);}
a.card .when{font-size:13px;color:var(--ink-faint);letter-spacing:.04em;}
a.card h2{font-family:"Kaisei Decol",serif;font-size:21px;margin:4px 0 8px;}
a.card p{margin:0 0 10px;font-size:14px;color:var(--ink-soft);}
a.card .go{font-size:14px;font-weight:700;color:var(--terracotta);}
a.card.ski .go{color:var(--blue);}
footer{margin-top:40px;font-size:13px;color:var(--ink-faint);}
</style>
</head>
<body>
<div class="wrap">
  <h1>educare イベントのご案内</h1>
  <p class="lead">ただいま募集中のイベントです。くわしくは、それぞれのページをご覧ください。</p>
  <div class="cards">
    <a class="card" href="tent/">
      <p class="when">2026年11月7日(土)–8日(日)</p>
      <h2>秋のお手軽テント泊</h2>
      <p>小幡緑地で1泊2日。焚き火を囲んで、外でクレープパーティー。年中〜小学生が対象です。</p>
      <span class="go">くわしく見る →</span>
    </a>
    <a class="card ski" href="ski/">
      <p class="when">2026年12月26日(土)–27日(日)</p>
      <h2>雪遊び&amp;スキーデビューツアー</h2>
      <p>鹿島槍スキー場で1泊2日。雪遊びだけ・スキーも雪遊びも・スキーだけの3プランから選べます。</p>
      <span class="go">くわしく見る →</span>
    </a>
  </div>
  <footer>主催：educare（エデュカーレ）</footer>
</div>
</body>
</html>
